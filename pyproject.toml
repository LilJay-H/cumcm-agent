[project]
name = "cumcm-agent-v0"
version = "0.1.0"
description = "Evidence-aware CUMCM modeling agent powered by Claude Code"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "requests>=2.31",
]

[project.scripts]
cumcm-agent = "cumcm_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
